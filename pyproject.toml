[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomcare"
version = "0.1.0"
description = "Evidence-backed hospice registration and building-fit investigation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]
agent = [
  "deepagents>=0.7.35,<0.8.0",
  "langchain-openai>=1.7.4,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["api*", "pipeline*", "engine*", "agent*", "eval*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipeline/tests", "engine/tests", "agent/tests", "eval/tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

